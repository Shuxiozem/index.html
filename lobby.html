<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Battle Lobby Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #101322;
  color: white;
}

.lobby {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 35%, #454d72 0%, #171b30 45%, #090b13 100%);
}

/* Fondo */

.sky {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      rgba(80,90,140,.2),
      rgba(0,0,0,.65)
    );
}

.floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35%;
  background:
    linear-gradient(
      #272b3b,
      #0d0f18
    );
  transform: perspective(500px) rotateX(25deg);
  transform-origin: bottom;
}

/* Personaje */

.character {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 150px;
  height: 350px;
  transform: translate(-50%, -50%);
}

/* Cabeza */

.head {
  position: absolute;
  width: 70px;
  height: 82px;
  left: 40px;
  top: 0;
  border-radius: 45%;
  background: #d49a72;
  z-index: 5;
}

/* Cabello */

.hair {
  position: absolute;
  width: 75px;
  height: 45px;
  left: 37px;
  top: -5px;
  border-radius: 50% 50% 20% 20%;
  background: #15151a;
  z-index: 6;
}

/* Cuello */

.neck {
  position: absolute;
  width: 32px;
  height: 35px;
  left: 59px;
  top: 72px;
  background: #c98e69;
}

/* Camisa */

.shirt {
  position: absolute;
  width: 110px;
  height: 125px;
  left: 20px;
  top: 95px;
  border-radius: 25px 25px 15px 15px;
  background: #272b42;
}

/* Chaqueta */

.jacket {
  position: absolute;
  width: 120px;
  height: 130px;
  left: 15px;
  top: 90px;
  border-radius: 25px;
  border: 7px solid #8b35ff;
  z-index: 3;
}

/* Brazos */

.arm {
  position: absolute;
  width: 30px;
  height: 125px;
  top: 100px;
  border-radius: 20px;
  background: #c98e69;
}

.arm.left {
  left: 0;
  transform: rotate(8deg);
}

.arm.right {
  right: 0;
  transform: rotate(-8deg);
}

/* Pantalón */

.pants {
  position: absolute;
  width: 105px;
  height: 125px;
  left: 22px;
  top: 210px;
  background: #171a28;
  border-radius: 15px;
}

/* Piernas */

.leg {
  position: absolute;
  width: 42px;
  height: 100px;
  top: 285px;
  background: #171a28;
  border-radius: 15px;
}

.leg.left {
  left: 28px;
}

.leg.right {
  right: 28px;
}

/* Zapatos */

.shoe {
  position: absolute;
  width: 55px;
  height: 25px;
  bottom: 0;
  background: #08090d;
  border-radius: 15px;
}

.shoe.left {
  left: 15px;
}

.shoe.right {
  right: 15px;
}

/* Panel superior */

.top {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.player {
  background: rgba(0,0,0,.45);
  padding: 10px 15px;
  border-radius: 12px;
}

.player strong {
  color: #b66cff;
}

/* Monedas */

.currency {
  background: rgba(0,0,0,.45);
  padding: 10px 15px;
  border-radius: 12px;
}

/* Menú */

.menu {
  position: absolute;
  left: 15px;
  bottom: 25px;

  display: flex;
  gap: 10px;
}

.menu button {
  border: 0;
  padding: 12px 15px;
  border-radius: 12px;

  background: rgba(20,20,30,.85);
  color: white;

  font-weight: bold;
}

/* Inventario */

.inventory {
  position: absolute;
  right: 15px;
  bottom: 25px;

  width: 145px;
  padding: 15px;

  background: rgba(15,15,25,.9);
  border-radius: 15px;
}

.inventory h3 {
  margin-top: 0;
}

.clothes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.clothes button {
  border: 1px solid #555;
  border-radius: 10px;
  padding: 10px;

  background: #24283a;
  color: white;
}

/* Botón jugar */

.play {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);

  padding: 15px 50px;

  border: 0;
  border-radius: 14px;

  background: #8b35ff;
  color: white;

  font-size: 18px;
  font-weight: bold;
}

/* Texto */

.title {
  position: absolute;
  top: 95px;
  left: 50%;
  transform: translateX(-50%);

  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="lobby">

  <div class="sky"></div>
  <div class="floor"></div>

  <div class="title">
    BATTLE LOBBY
  </div>

  <!-- Personaje -->

  <div class="character">

    <div class="hair"></div>
    <div class="head"></div>
    <div class="neck"></div>

    <div class="shirt"></div>
    <div class="jacket"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="pants"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="shoe left"></div>
    <div class="shoe right"></div>

  </div>

  <!-- Información -->

  <div class="top">

    <div class="player">
      👤 <strong>PLAYER</strong>
      <br>
      Nivel 1
    </div>

    <div class="currency">
      🪙 1,250
      &nbsp;
      💎 150
    </div>

  </div>

  <!-- Menú -->

  <div class="menu">

    <button onclick="showMessage('Inventario')">
      🎒 Inventario
    </button>

    <button onclick="showMessage('Tienda')">
      🛒 Tienda
    </button>

  </div>

  <!-- Ropa -->

  <div class="inventory">

    <h3>👕 Ropa</h3>

    <div class="clothes">

      <button onclick="changeJacket('#8b35ff')">
        🟣 Morado
      </button>

      <button onclick="changeJacket('#e53935')">
        🔴 Rojo
      </button>

      <button onclick="changeJacket('#2196f3')">
        🔵 Azul
      </button>

      <button onclick="changeJacket('#111111')">
        ⚫ Negro
      </button>

    </div>

  </div>

  <!-- Jugar -->

  <button class="play"
          onclick="showMessage('Buscando partida...')">
    JUGAR
  </button>

</div>

<script>

function changeJacket(color) {

  document.querySelector(".jacket").style.borderColor = color;

}

function showMessage(message) {

  alert(message);

}

</script>

</body>
</html>
