<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <h1>EXTERNAL DEMO</h1>
    <p class="version">v1.0 • DEMO ONLY</p>

    <div class="feature">
      <span>🎯 AIMBOT</span>
      <button onclick="toggle(this)">OFF</button>
    </div>

    <div class="feature">
      <span>👁️ ESP</span>
      <button onclick="toggle(this)">OFF</button>
    </div>

    <div class="feature">
      <span>⚡ SPEED</span>
      <button onclick="toggle(this)">OFF</button>
    </div>

    <div class="feature">
      <span>🔫 NO RECOIL</span>
      <button onclick="toggle(this)">OFF</button>
    </div>

    <button class="launch" onclick="launchDemo()">LAUNCH</button>

    <div id="status">STATUS: READY</div>

    <small>Fictional interface — does not modify any game</small>
  </div>

  <div id="crosshair" class="crosshair">
    <div class="crosshair-line horizontal"></div>
    <div class="crosshair-line vertical"></div>
    <div class="crosshair-dot"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
